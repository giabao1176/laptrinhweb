<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h2 class="mb-4">Quản lý Danh mục (Category)</h2>

    <div class="row mb-3">
        <div class="col-md-6">
            <a th:href="@{/admin/categories/add}" class="btn btn-primary">
                + Thêm mới danh mục
            </a>
        </div>

        <div class="col-md-6">
            <form th:action="@{/admin/categories}" method="get" class="d-flex">
                <input class="form-control me-2" type="text" name="keyword" 
                       th:value="${keyword}" placeholder="Nhập tên danh mục...">
                <button class="btn btn-outline-success" type="submit">Tìm kiếm</button>
            </form>
        </div>
    </div>

    <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Tên danh mục</th>
                <th>Người tạo</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${page.content}">
                <td th:text="${item.categoryId}"></td>
                <td th:text="${item.categoryname}"></td>
                
                <td th:text="${item.user != null ? item.user.fullname : 'Chưa có user'}"></td>
                
                <td>
                    <span th:if="${item.status}" class="badge bg-success">Active</span>
                    <span th:unless="${item.status}" class="badge bg-secondary">Inactive</span>
                </td>
                
                <td>
                    <a th:href="@{/admin/categories/edit/{id}(id=${item.categoryId})}" 
                       class="btn btn-warning btn-sm">Sửa</a>
                    
                    <a th:href="@{/admin/categories/delete/{id}(id=${item.categoryId})}" 
                       onclick="return confirm('Bạn có chắc chắn muốn xóa không?')"
                       class="btn btn-danger btn-sm">Xóa</a>
                </td>
            </tr>
            <tr th:if="${page.content.isEmpty()}">
                <td colspan="5" class="text-center text-muted">Không có dữ liệu nào.</td>
            </tr>
        </tbody>
    </table>

    <nav aria-label="Page navigation" th:if="${page.totalPages > 0}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/categories(page=${page.number - 1}, keyword=${keyword})}">Trước</a>
            </li>
            
            <li class="page-item disabled">
                <a class="page-link" href="#" th:text="${(page.number + 1) + ' / ' + page.totalPages}"></a>
            </li>

            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/categories(page=${page.number + 1}, keyword=${keyword})}">Sau</a>
            </li>
        </ul>
    </nav>
</div>

</body>
</html>
